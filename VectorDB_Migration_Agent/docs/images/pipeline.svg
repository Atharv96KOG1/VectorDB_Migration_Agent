<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="420" fill="#ffffff"/>
  <text x="780" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Retrieval-preservation pipeline</text>
  <text x="780" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Migration is treated as "will retrieval quality survive?", not "did the bytes copy?"</text>

  <!-- SOURCE -->
  <g>
    <rect x="30" y="150" width="190" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">SOURCE</text>
    <rect x="50" y="192" width="150" height="30" rx="7" fill="#1a73e8"/>
    <text x="125" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Pinecone</text>
    <rect x="50" y="228" width="150" height="30" rx="7" fill="#dc244c"/>
    <text x="125" y="248" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Qdrant</text>
  </g>

  <line x1="220" y1="210" x2="252" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Discover + compatibility -->
  <g>
    <rect x="255" y="110" width="230" height="200" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="370" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Discover +</text>
    <text x="370" y="154" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Compatibility</text>
    <text x="370" y="180" text-anchor="middle" font-size="10.5" fill="#475569">Tri-state capability</text>
    <text x="370" y="195" text-anchor="middle" font-size="10.5" fill="#475569">(TRUE / FALSE / UNKNOWN)</text>
    <text x="370" y="218" text-anchor="middle" font-size="10.5" fill="#475569">dim · metric · dtype</text>
    <text x="370" y="233" text-anchor="middle" font-size="10.5" fill="#475569">quantization · semantic</text>
    <text x="370" y="248" text-anchor="middle" font-size="10.5" fill="#475569">space identity</text>
    <text x="370" y="270" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">never coerced permissive</text>
  </g>

  <line x1="485" y1="210" x2="517" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Benchmark-gated selection -->
  <g>
    <rect x="520" y="90" width="330" height="240" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="685" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Benchmark-gated selection</text>

    <rect x="540" y="130" width="130" height="26" rx="6" fill="#1d4ed8"/>
    <text x="605" y="148" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">direct_copy</text>
    <rect x="680" y="130" width="150" height="26" rx="6" fill="#1d4ed8"/>
    <text x="755" y="148" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">pca / random_proj</text>

    <rect x="540" y="162" width="130" height="26" rx="6" fill="#1d4ed8"/>
    <text x="605" y="180" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">mrl</text>
    <rect x="680" y="162" width="150" height="26" rx="6" fill="#1d4ed8"/>
    <text x="755" y="180" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">ridge / procrustes</text>

    <rect x="540" y="194" width="290" height="26" rx="6" fill="#1d4ed8"/>
    <text x="685" y="212" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">re_embedding (documents)</text>

    <rect x="540" y="226" width="290" height="26" rx="6" fill="#93c5fd"/>
    <text x="685" y="244" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">stubs: distillation / vec2vec / trained-projection / SMEC</text>

    <text x="685" y="270" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Recall@K · NDCG@K · MRR · overlap · rank corr.</text>
    <text x="685" y="286" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">only an already-EXECUTED benchmark can be cited</text>
    <text x="685" y="302" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">(anti-hallucination guardrail, enforced mechanically)</text>
  </g>

  <line x1="850" y1="210" x2="882" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Migrate + verify -->
  <g>
    <rect x="885" y="130" width="230" height="160" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1000" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Migrate + Verify</text>
    <text x="1000" y="182" text-anchor="middle" font-size="10.5" fill="#475569">checkpoint / resume</text>
    <text x="1000" y="197" text-anchor="middle" font-size="10.5" fill="#475569">idempotent upsert</text>
    <text x="1000" y="212" text-anchor="middle" font-size="10.5" fill="#475569">id-collision policy</text>
    <text x="1000" y="227" text-anchor="middle" font-size="10.5" fill="#475569">golden-query verify</text>
    <text x="1000" y="242" text-anchor="middle" font-size="10.5" fill="#475569">real rollback (by id)</text>
    <text x="1000" y="264" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">confidence score = honest</text>
    <text x="1000" y="278" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">mean of measured metrics only</text>
  </g>

  <line x1="1115" y1="210" x2="1147" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TARGET -->
  <g>
    <rect x="1150" y="150" width="190" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1245" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">TARGET</text>
    <rect x="1170" y="192" width="150" height="30" rx="7" fill="#1a73e8"/>
    <text x="1245" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Pinecone</text>
    <rect x="1170" y="228" width="150" height="30" rx="7" fill="#dc244c"/>
    <text x="1245" y="248" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Qdrant</text>
  </g>

  <text x="780" y="400" text-anchor="middle" font-size="11" fill="#64748b">Built on the Aetherion SDK — @agent() drives a deterministic Temporal workflow; every box above runs as a @tool() activity</text>
</svg>
