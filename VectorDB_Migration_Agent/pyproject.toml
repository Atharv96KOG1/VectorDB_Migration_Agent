[project]
name = "VectorDB_Migration_Agent"
version = "0.0.16"
description = "Universal Vector DB Migration Agent: benchmark-gated, retrieval-preserving migration between vector databases (Pinecone <-> Qdrant in this build)."
authors = [{ name = "Calfus Inc.", email = "support@calfus.com" }]
readme = "README.md"
requires-python = ">=3.12.10,<3.14"


dependencies = [
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.55-cp312-cp312-macosx_15_0_arm64.whl",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "qdrant-client>=1.19",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# aetherion-sdk only ships a macOS/arm64 cp312 wheel, so constrain resolution to that
# environment — otherwise `uv lock` tries (and fails) to solve for every platform/Python
# combination requires-python nominally allows.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_full_version >= '3.12.10' and python_full_version < '3.13'",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
