name: CI — Tests, Quality & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: VectorDB_Migration_Agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: VectorDB_Migration_Agent/pyproject.toml

      # The Aetherion SDK wheel in pyproject.toml returns 403 to hosted CI.
      # Application logic tests use this test-only shim for its decorators;
      # they do not test the actual Aetherion runtime or worker integration.
      - name: Prepare test-only Aetherion SDK shim
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-stubs/aetherion_sdk"
          cat > "${RUNNER_TEMP}/ci-stubs/aetherion_sdk/__init__.py" <<'PY'
          def _identity_decorator(*args, **kwargs):
              if len(args) == 1 and callable(args[0]) and not kwargs:
                  return args[0]

              def decorate(fn):
                  return fn

              return decorate

          agent = _identity_decorator
          tool = _identity_decorator

          class _ToolExecutor:
              async def execute(self, *args, **kwargs):
                  raise RuntimeError(
                      "Aetherion workflow execution is intentionally unavailable in CI."
                  )

          toolExecutor = _ToolExecutor()
          PY
          echo "PYTHONPATH=${RUNNER_TEMP}/ci-stubs" >> "$GITHUB_ENV"

      - name: Install public runtime and test dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=2.0" "scipy>=1.14" "scikit-learn>=1.5" \
            "qdrant-client>=1.19" "httpx>=0.27" \
            "pydantic>=2.9" "pydantic-settings>=2.6" \
            "pytest==9.0.3" "pytest-asyncio==1.3.0" "pytest-cov==6.3.0"

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=unit-test-results.xml

      - name: Run local Qdrant integration tests
        run: python -m pytest tests/integration -v --junitxml=integration-test-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-coverage-reports
          path: |
            unit-test-results.xml
            integration-test-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify dependency consistency
        if: steps.dependencies.outcome == 'success'
        run: python -m pip check

      - name: Install pip-audit
        if: always() && steps.dependencies.outcome == 'success'
        run: python -m pip install pip-audit

      - name: Audit installed public dependencies
        if: always() && steps.dependencies.outcome == 'success'
        run: python -m pip_audit --local

  code-quality:
    name: Ruff lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: VectorDB_Migration_Agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install configured Ruff version
        run: python -m pip install "ruff==0.12.12"

      - name: Lint
        run: ruff check src tests scripts

      - name: Check formatting
        run: ruff format --check src tests scripts

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan for high-severity static-analysis findings
        run: semgrep scan --config auto --severity ERROR --error VectorDB_Migration_Agent

  secret-scan:
    name: Gitleaks secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
