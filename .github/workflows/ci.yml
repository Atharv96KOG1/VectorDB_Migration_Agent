name: CI — Tests, Quality & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VectorDB_Migration_Agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The Aetherion SDK configured in pyproject.toml is a platform-specific
      # macOS ARM wheel. CI installs the test runtime explicitly and avoids that wheel.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             "numpy>=2.0" "scipy>=1.14" "scikit-learn>=1.5"             "qdrant-client>=1.19" "httpx>=0.27"             "pydantic>=2.9" "pydantic-settings>=2.6"             "pytest==8.4.2" "pytest-asyncio==1.3.0" "pytest-cov==6.3.0"

      - name: Run unit tests
        run: python -m pytest tests/unit -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            VectorDB_Migration_Agent/test-results.xml
            VectorDB_Migration_Agent/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  integration-tests:
    name: Local Qdrant integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VectorDB_Migration_Agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             "numpy>=2.0" "scipy>=1.14" "scikit-learn>=1.5"             "qdrant-client>=1.19" "httpx>=0.27"             "pydantic>=2.9" "pydantic-settings>=2.6"             "pytest==8.4.2" "pytest-asyncio==1.3.0"

      - name: Run integration tests
        run: python -m pytest tests/integration -v --junitxml=integration-results.xml

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: VectorDB_Migration_Agent/integration-results.xml
          if-no-files-found: ignore
          retention-days: 14

  code-quality:
    name: Ruff lint and format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VectorDB_Migration_Agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff==0.12.12"

      - name: Lint
        run: ruff check src tests scripts

      - name: Check formatting
        run: ruff format --check src tests scripts

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan source code
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/security-audit

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VectorDB_Migration_Agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Auditing the declared requirement set avoids installing the macOS-only SDK wheel.
      - name: Audit direct runtime dependencies
        run: |
          python -m pip_audit             --requirement <(printf '%s\n'               'numpy>=2.0'               'scipy>=1.14'               'scikit-learn>=1.5'               'qdrant-client>=1.19'               'httpx>=0.27'               'pydantic>=2.9'               'pydantic-settings>=2.6')

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
